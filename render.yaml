# AOTA v1 — Render Infrastructure as Code.
# Keep-warm: register /health with UptimeRobot (free, uptimerobot.com)
# and set it to ping every 5 minutes. No paid cron service needed.

services:
  - type: web
    name: aota-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: SOURCE_PORTAL_URL
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: COLLECT_INTERVAL_S
        value: "60"
      - key: CACHE_TTL_S
        value: "55"
      - key: MAX_DATA_AGE_S
        value: "180"
